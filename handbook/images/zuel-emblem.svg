<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 中南财经政法大学 校徽（基于官方描述还原） -->
  <defs>
    <style>
      .emblem-red{fill:#8B1A1A}
      .emblem-gold{fill:none;stroke:#C4A35A;stroke-width:1.5}
    </style>
  </defs>
  <!-- 外圈 -->
  <circle cx="100" cy="100" r="96" fill="none" class="emblem-red" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" class="emblem-red" stroke-width="1"/>
  <!-- 内圈 -->
  <circle cx="100" cy="100" r="64" fill="none" class="emblem-red" stroke-width="1.5"/>

  <!-- 上半圈：中南财经政法大学（弧形排列模拟） -->
  <path id="topArc" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <text font-family="STSong,'Source Han Serif SC',SimSun,serif" font-size="15" font-weight="700" fill="#8B1A1A" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">中南财经政法大学</textPath>
  </text>

  <!-- 下半圈：英文校名 -->
  <path id="btmArc" d="M 32 108 A 68 68 0 0 0 168 108" fill="none"/>
  <text font-family="Arial,Helvetica,sans-serif" font-size="7" font-weight="600" fill="#8B1A1A" letter-spacing="1">
    <textPath href="#btmArc" startOffset="50%" text-anchor="middle">ZHONGNAN UNIVERSITY OF ECONOMICS AND LAW</textPath>
  </text>

  <!-- 中心图案：人字/箭头/A字形（基于官方描述：实体为"人"、虚体为"文"、形如向上箭头） -->
  <g transform="translate(100,95)" class="emblem-red">
    <!-- 人字主体：像一个人张开双臂 + 向上箭头 -->
    <path d="M -6 18 L 0 -2 L 6 18 M -20 8 Q 0 -18 20 8 M -12 22 L 0 10 L 12 22"
      fill="none" stroke="#8B1A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 箭头尖（冲破内圈寓意） -->
    <path d="M 0 -2 L -5 -14 L 0 -10 L 5 -14 Z" fill="#8B1A1A"/>
  </g>

  <!-- 1948 建校年份 -->
  <text x="100" y="134" text-anchor="middle" font-family="'Source Han Serif SC',STSong,serif"
    font-size="11" font-weight="700" fill="#8B1A1A" letter-spacing="2">1948</text>

  <!-- 中国 武汉 -->
  <text x="100" y="147" text-anchor="middle" font-family="STSong,'Source Han Serif SC',SimSun,serif"
    font-size="7.5" fill="#8B1A1A" letter-spacing="1">中国·武汉</text>
</svg>
# 蛮有味后端 · Render 部署配置（免费层方案 B）
# 用法：Render 控制台 → New + → Blueprint → 贴本文件；或 push 到 Git 后 Render 自动识别。
# 注意：免费实例 15 分钟无流量休眠；可用 cron（如 cron-job.org 免费）每 10 分钟 GET /health 保活。
services:
  - type: web
    name: manyouwei-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: hypha/implementation
    buildCommand: npm install --omit=dev
    startCommand: node src/httpServer.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MYWO_PORT
        value: "8799"
      - key: MYWO_DATASOURCE
        value: wuhan
      # 以下为敏感项，在 Render Dashboard 的 Environment 中逐个配置（勿写死在仓库）：
      # AUTH_JWT_SECRET / AUTH_DATA_KEY / DEEPSEEK_API_KEY / AMAP_SERVER_KEY /
      # ADMIN_TOKEN / ALLOWED_ORIGINS / FRONTEND_ORIGIN
